<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualiTracker Quiz — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
let state = { loading: false, data: null, error: null };

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`<div>${headerBlock("Live results across the conference.")}</div>`));

  const backLink = el(`<div class="link-row"><a id="backLink">Open registration →</a></div>`);
  backLink.querySelector('a').addEventListener('click', () => { window.location.href = 'index.html'; });
  app.appendChild(backLink);

  const refreshBtn = el(`<button class="btn btn-ghost" id="refreshBtn" style="margin-top:14px;">Refresh</button>`);
  refreshBtn.addEventListener('click', load);
  app.appendChild(refreshBtn);

  const content = el(`<div id="lbContent"></div>`);
  app.appendChild(content);
  renderContent(content);
}

function renderContent(container){
  container.innerHTML = '';
  if(state.loading){ container.appendChild(el(`<div class="loading-note">Loading results…</div>`)); return; }
  if(state.error){ container.appendChild(el(`<div class="empty-note">Couldn't load results. Try refresh.</div>`)); return; }
  const data = state.data || [];
  if(data.length === 0){ container.appendChild(el(`<div class="empty-note">No one has finished the quiz yet.</div>`)); return; }

  const byScore = [...data].sort((a,b) => b.score - a.score).slice(0, 10);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Top participants</h3></div>`));
  byScore.forEach((r, i) => {
    const avatarHtml = (i < 3)
      ? (r.photoUrl ? `<img class="avatar" src="${r.photoUrl}" alt="${escapeHtml(r.name)}" />` : `<div class="avatar-placeholder">${escapeHtml((r.name||'?').charAt(0).toUpperCase())}</div>`)
      : '';
    container.appendChild(el(`
      <div class="lb-row">
        <div class="lb-rank">${i+1}</div>
        ${avatarHtml}
        <div class="lb-main"><div class="lb-name">${escapeHtml(r.name)}</div><div class="lb-sub">${escapeHtml(r.facility)} · ${escapeHtml(r.region)}</div></div>
        <div class="lb-score mono">${r.score}</div>
      </div>`));
  });

  const byFacility = {};
  data.forEach(r => { const k = r.facility || 'Unknown'; if(!byFacility[k]) byFacility[k] = {total:0,count:0}; byFacility[k].total += r.score; byFacility[k].count += 1; });
  const facilityRanked = Object.entries(byFacility).map(([name,v]) => ({name, avg: Math.round(v.total/v.count), count: v.count})).sort((a,b)=>b.avg-a.avg).slice(0,3);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Top institutions</h3></div>`));
  facilityRanked.forEach((f,i) => {
    container.appendChild(el(`
      <div class="lb-row"><div class="lb-rank">${i+1}</div>
        <div class="lb-main"><div class="lb-name">${escapeHtml(f.name)}</div><div class="lb-sub">${f.count} participant${f.count===1?'':'s'}</div></div>
        <div class="lb-score mono">${f.avg}</div></div>`));
  });

  const byRegion = {};
  data.forEach(r => { const k = r.region || 'Unknown'; if(!byRegion[k]) byRegion[k] = {total:0,count:0}; byRegion[k].total += r.score; byRegion[k].count += 1; });
  const regionRanked = Object.entries(byRegion).map(([name,v]) => ({name, avg: Math.round(v.total/v.count), count: v.count})).sort((a,b)=>b.avg-a.avg);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Average score by region</h3></div>`));
  regionRanked.forEach(r => {
    container.appendChild(el(`
      <div class="lb-row">
        <div class="lb-main"><div class="lb-name">${escapeHtml(r.name)}</div><div class="lb-sub">${r.count} participant${r.count===1?'':'s'}</div></div>
        <div class="lb-score mono">${r.avg}</div></div>`));
  });

  container.appendChild(el(`<div class="empty-note">${data.length} total ${data.length===1?'response':'responses'} recorded</div>`));
}

async function load(){
  state.loading = true; state.error = null;
  const content = document.getElementById('lbContent');
  if(content) renderContent(content);
  try {
    const data = await apiGet('leaderboard');
    state.data = Array.isArray(data) ? data : [];
  } catch(err){ console.error('Failed to load leaderboard', err); state.error = err; }
  finally {
    state.loading = false;
    const c = document.getElementById('lbContent');
    if(c) renderContent(c);
  }
}

render();
load();
setInterval(load, 20000);
</script>
</body>
</html>
