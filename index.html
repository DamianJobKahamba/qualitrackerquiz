<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualiTracker Quiz — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
let state = {
  screen: 'form',
  lastPin: null,
  participant: { name: "", region: "", district: "", facility: "", facilityOther: "", photo: null }
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(state.screen === 'form' ? renderForm() : renderDone());
}

function renderForm(){
  const wrap = el(`<div>${headerBlock("Register once to get your PIN, then take the quiz on the login page.")}</div>`);

  const qrWrap = el(`
    <div class="card qr-wrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(window.location.href)}" width="140" height="140" alt="QR code to registration" />
      <span>Scan to register on your phone</span>
    </div>`);
  wrap.appendChild(qrWrap);

  const card = el(`<div class="card"></div>`);

  const photoLabel = el(`<label>Your photo</label>`);
  const photoPicker = el(`
    <div class="photo-picker">
      <div class="photo-preview" id="photoPreview">Tap to add photo</div>
      <input type="file" id="photoInput" accept="image/*" capture="user" style="display:none;" />
      <button type="button" class="btn btn-ghost" id="photoBtn" style="margin-top:0;width:auto;padding:10px 18px;">Take / choose photo</button>
    </div>`);
  card.appendChild(photoLabel);
  card.appendChild(photoPicker);

  const preview = photoPicker.querySelector('#photoPreview');
  if(state.participant.photo){
    preview.outerHTML = `<img id="photoPreview" class="photo-preview filled" src="${state.participant.photo}" alt="Your photo" />`;
  }
  photoPicker.querySelector('#photoBtn').addEventListener('click', () => photoPicker.querySelector('#photoInput').click());
  photoPicker.querySelector('#photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const dataUrl = await fileToResizedDataUrl(file, 220, 0.75);
      state.participant.photo = dataUrl;
      render();
    } catch(err){ console.error('Photo processing failed', err); }
  });

  const nameLabel = el(`<label for="pname">Your name</label>`);
  const nameInput = el(`<input type="text" id="pname" placeholder="e.g. Asha Mwakalinga" autocomplete="name" />`);
  nameInput.value = state.participant.name;
  nameInput.addEventListener('input', e => { state.participant.name = e.target.value; updateButton(); });

  const regionLabel = el(`<label for="pregion">Region</label>`);
  const regionSelect = el(`<select id="pregion"></select>`);
  regionSelect.appendChild(el(`<option value="">Select region…</option>`));
  Object.keys(REGION_DATA).forEach(r => regionSelect.appendChild(el(`<option value="${r}">${r}</option>`)));
  regionSelect.appendChild(el(`<option value="__other__">Other / not listed</option>`));
  regionSelect.value = state.participant.region;

  const districtLabel = el(`<label for="pdistrict">District</label>`);
  const districtSelect = el(`<select id="pdistrict" disabled></select>`);
  districtSelect.appendChild(el(`<option value="">Select district…</option>`));

  const facilityLabel = el(`<label for="pfacility">Health facility / institution</label>`);
  const facilitySelect = el(`<select id="pfacility" disabled></select>`);
  facilitySelect.appendChild(el(`<option value="">Select facility…</option>`));

  const facilityOtherInput = el(`<input type="text" id="pfacilityOther" placeholder="Type your facility name" style="display:none;margin-top:8px;" />`);
  facilityOtherInput.value = state.participant.facilityOther;
  facilityOtherInput.addEventListener('input', e => { state.participant.facilityOther = e.target.value; updateButton(); });

  function populateDistricts(region){
    districtSelect.innerHTML = '<option value="">Select district…</option>';
    if(region && region !== '__other__' && REGION_DATA[region]){
      Object.keys(REGION_DATA[region]).forEach(d => districtSelect.appendChild(el(`<option value="${d}">${d}</option>`)));
      districtSelect.disabled = false;
    } else districtSelect.disabled = true;
  }
  function populateFacilities(region, district){
    facilitySelect.innerHTML = '<option value="">Select facility…</option>';
    if(region && region !== '__other__' && district && REGION_DATA[region] && REGION_DATA[region][district]){
      REGION_DATA[region][district].forEach(f => facilitySelect.appendChild(el(`<option value="${f}">${f}</option>`)));
      facilitySelect.disabled = false;
      facilityOtherInput.style.display = 'none';
    } else facilitySelect.disabled = true;
  }

  regionSelect.addEventListener('change', e => {
    state.participant.region = e.target.value; state.participant.district = ''; state.participant.facility = '';
    populateDistricts(e.target.value);
    facilitySelect.innerHTML = '<option value="">Select facility…</option>'; facilitySelect.disabled = true;
    facilityOtherInput.style.display = (e.target.value === '__other__') ? 'block' : 'none';
    updateButton();
  });
  districtSelect.addEventListener('change', e => {
    state.participant.district = e.target.value; state.participant.facility = '';
    populateFacilities(state.participant.region, e.target.value);
    updateButton();
  });
  facilitySelect.addEventListener('change', e => { state.participant.facility = e.target.value; updateButton(); });

  if(state.participant.region) populateDistricts(state.participant.region);
  if(state.participant.region && state.participant.district) populateFacilities(state.participant.region, state.participant.district);

  card.appendChild(nameLabel); card.appendChild(nameInput);
  card.appendChild(regionLabel); card.appendChild(regionSelect);
  card.appendChild(districtLabel); card.appendChild(districtSelect);
  card.appendChild(facilityLabel); card.appendChild(facilitySelect);
  card.appendChild(facilityOtherInput);

  const regBtn = el(`<button class="btn btn-primary" id="regBtn" disabled>Register &amp; get my PIN</button>`);
  regBtn.addEventListener('click', register);
  card.appendChild(regBtn);

  wrap.appendChild(card);
  setTimeout(updateButton, 0);
  return wrap;
}

function updateButton(){
  const btn = document.getElementById('regBtn');
  if(!btn) return;
  const p = state.participant;
  const facilityOk = p.region === '__other__' ? (p.facilityOther && p.facilityOther.trim().length > 0) : !!p.facility;
  const ok = p.name.trim().length > 0 && !!p.region && (p.region === '__other__' || !!p.district) && facilityOk && !!p.photo;
  btn.disabled = !ok;
  btn.textContent = p.photo ? 'Register & get my PIN' : 'Add a photo to continue';
}

async function register(){
  const btn = document.getElementById('regBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Registering…'; }
  const p = state.participant;
  const facilityName = p.region === '__other__' ? (p.facilityOther || 'Other') : p.facility;
  const pin = generatePin();
  try {
    const res = await apiPost({
      action: 'register', name: p.name.trim(), pin,
      region: p.region === '__other__' ? 'Other' : p.region,
      district: p.region === '__other__' ? '—' : p.district,
      facility: facilityName, photo: p.photo
    });
    if(!res || !res.ok){ throw new Error((res && res.error) || 'unknown error'); }
    state.lastPin = res.pin;
    state.screen = 'done';
    render();
  } catch(err){
    console.error('Registration failed', err);
    alert('Registration failed — check that WEB_APP_URL in config.js is set correctly, and try again.');
    if(btn){ btn.disabled = false; btn.textContent = 'Register & get my PIN'; }
  }
}

function renderDone(){
  const wrap = el(`<div>${headerBlock("You're registered.")}</div>`);
  const card = el(`
    <div class="card">
      <label style="margin-top:0;">Your name</label>
      <div style="font-weight:600;font-size:16px;">${escapeHtml(state.participant.name)}</div>
      <label>Your PIN</label>
      <div class="pin-display">${state.lastPin}</div>
      <div class="pin-note">Save this PIN — you'll need it with your name to log in and take the quiz. It only works once.</div>
    </div>`);
  wrap.appendChild(card);

  const nav = el(`<div class="footer-nav"></div>`);
  const quizBtn = el(`<button class="btn btn-primary">Go to quiz login</button>`);
  quizBtn.addEventListener('click', () => { window.location.href = 'quiz.html'; });
  const anotherBtn = el(`<button class="btn btn-ghost">Register someone else</button>`);
  anotherBtn.addEventListener('click', () => {
    state.participant = { name: "", region: "", district: "", facility: "", facilityOther: "", photo: null };
    state.screen = 'form'; state.lastPin = null; render();
  });
  nav.appendChild(quizBtn); nav.appendChild(anotherBtn);
  wrap.appendChild(nav);
  return wrap;
}

render();
</script>
</body>
</html>
