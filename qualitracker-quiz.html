<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualiTracker Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14231F; --paper:#F7F5EF; --teal:#0F6B5C; --teal-dark:#0B4F44; --teal-soft:#E3EEEA;
    --gold:#E8A93A; --brick:#C4432B; --green:#3FA34D; --card:#FFFFFF; --muted:#6B7A75; --border:#DDD8C9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 18px 60px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .header{text-align:center;padding:8px 0 18px;}
  .header h1{font-size:28px;font-weight:700;color:var(--ink);line-height:1.1;}
  .header p{color:var(--muted);font-size:14px;margin-top:6px;}
  .pulse-line{width:100%;height:22px;margin:14px 0 4px;}
  .pulse-line path{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 2.6s ease-in-out infinite;}
  @keyframes draw{0%{stroke-dashoffset:220;}50%{stroke-dashoffset:0;}100%{stroke-dashoffset:-220;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(20,35,31,.04);}
  .card + .card{margin-top:14px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--teal-dark);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=password], select, textarea{
    width:100%;padding:12px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--paper);font-family:'IBM Plex Sans',sans-serif;font-size:15px;color:var(--ink);
  }
  input[type=text].pin-input{font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;font-size:20px;text-align:center;}
  textarea{resize:vertical;min-height:90px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  select:disabled{opacity:.5;}
  .btn{width:100%;padding:14px 16px;border-radius:10px;border:none;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;margin-top:18px;transition:transform .08s ease;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{background:#B9C6C1;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:var(--brick);border:1px solid #E7C7BE;font-size:13px;padding:8px 12px;margin-top:0;width:auto;}
  .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px;}
  .qr-wrap img{border-radius:10px;border:1px solid var(--border);background:#fff;padding:6px;}
  .qr-wrap span{font-size:11px;color:var(--muted);}
  .link-row{text-align:center;margin-top:22px;font-size:13px;}
  .link-row a{color:var(--teal-dark);cursor:pointer;text-decoration:underline;font-weight:500;}
  .photo-picker{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 2px;}
  .photo-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;border:2px dashed var(--border);}
  .photo-preview.filled{border:2px solid var(--gold);}
  .avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;}
  .avatar-placeholder{width:56px;height:56px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:'Fraunces',serif;}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .qcount{font-size:13px;color:var(--muted);font-weight:600;}
  .ring-wrap{position:relative;width:54px;height:54px;flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--border);stroke-width:5;}
  .ring-fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .2s linear, stroke .2s;}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;}
  .qtext{font-size:19px;font-weight:600;line-height:1.35;margin:6px 0 20px;}
  .opt{width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:2px solid transparent;font-size:15px;font-weight:500;margin-bottom:10px;cursor:pointer;color:#fff;transition:filter .15s, transform .08s;}
  .opt:active{transform:scale(.99);}
  .opt-0{background:#3468C0;} .opt-1{background:#7A3FA3;} .opt-2{background:var(--teal);} .opt-3{background:#C4432B;}
  .opt.correct{outline:3px solid var(--green);} .opt.incorrect{outline:3px solid #8B2F1E;opacity:.55;} .opt.dim{opacity:.35;}
  .opt:disabled{cursor:default;}
  .feedback{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;margin-top:6px;}
  .feedback.good{color:var(--green);} .feedback.bad{color:var(--brick);}
  .score-hero{text-align:center;padding:18px 0 4px;}
  .score-hero .big{font-family:'Fraunces',serif;font-size:56px;font-weight:700;color:var(--teal-dark);}
  .score-hero .cap{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .stat-row{display:flex;gap:10px;margin-top:16px;}
  .stat{flex:1;background:var(--teal-soft);border-radius:10px;padding:12px;text-align:center;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--teal-dark);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .lb-section-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;}
  .lb-section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .lb-section-title h3{font-size:15px;font-weight:600;}
  .lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--border);margin-bottom:7px;}
  .lb-rank{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--teal);width:22px;text-align:center;flex-shrink:0;}
  .lb-main{flex:1;min-width:0;}
  .lb-name{font-weight:600;font-size:14px;}
  .lb-sub{font-size:11px;color:var(--muted);}
  .lb-score{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--teal-dark);flex-shrink:0;}
  .empty-note{font-size:13px;color:var(--muted);text-align:center;padding:14px 0;}
  .loading-note{font-size:13px;color:var(--muted);text-align:center;padding:14px 0;}
  .footer-nav{display:flex;gap:10px;margin-top:22px;}
  .footer-nav .btn{margin-top:0;}
  .admin-q{border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px;}
  .admin-q .aq-prompt{font-weight:600;font-size:14px;margin-bottom:6px;}
  .admin-q .aq-opts{font-size:12px;color:var(--muted);line-height:1.5;}
  .admin-q .aq-correct{color:var(--green);font-weight:600;}
  .admin-q-foot{display:flex;justify-content:flex-end;margin-top:8px;}
  .pill{display:inline-block;background:var(--teal-soft);color:var(--teal-dark);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;margin-right:6px;}
  .divider{border:none;border-top:1px solid var(--border);margin:22px 0;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .pin-display{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;letter-spacing:.14em;text-align:center;color:var(--teal-dark);background:var(--teal-soft);border-radius:12px;padding:22px 10px;margin:14px 0 6px;}
  .pin-note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   EDIT BEFORE THE EVENT
   ============================================================ */
const ADMIN_PASSWORD = "qualitracker2026";

const REGION_DATA = {
  "Dar es Salaam": {
    "Ilala": ["Amana Regional Referral Hospital", "Ilala Health Centre"],
    "Kinondoni": ["Mwananyamala Regional Hospital", "Kinondoni Health Centre"],
    "Temeke": ["Temeke Regional Referral Hospital"]
  },
  "Arusha": {
    "Arusha City": ["Mount Meru Regional Referral Hospital", "Arusha Lutheran Medical Centre"],
    "Meru": ["Nkoaranga Hospital", "Meru District Hospital"]
  },
  "Mwanza": {
    "Nyamagana": ["Bugando Medical Centre", "Sekou Toure Regional Hospital"],
    "Ilemela": ["Ilemela District Hospital"]
  },
  "Dodoma": { "Dodoma City": ["Dodoma Regional Referral Hospital", "Benjamin Mkapa Hospital"] },
  "Mbeya": { "Mbeya City": ["Mbeya Zonal Referral Hospital", "Meta Health Centre"] },
  "Kilimanjaro": { "Moshi": ["Kilimanjaro Christian Medical Centre (KCMC)", "Mawenzi Regional Referral Hospital"] }
};

const SEED_QUESTIONS = [
  { prompt: "What does EQA stand for in laboratory quality management?", options: ["Extended Quality Audit", "External Quality Assessment", "Essential Quality Analysis", "Equipment Quality Assurance"], correctIndex: 1 },
  { prompt: "Which ISO standard specifically addresses medical laboratory quality and competence?", options: ["ISO 9001", "ISO 17025", "ISO 15189", "ISO 13485"], correctIndex: 2 },
  { prompt: "In an HIV testing algorithm, what is the purpose of a confirmatory test?", options: ["To reduce testing cost", "To replace screening entirely", "To verify a reactive screening result", "To speed up turnaround time"], correctIndex: 2 },
  { prompt: "What is the primary goal of biosafety practices in a laboratory?", options: ["Increase testing speed", "Reduce reagent costs", "Improve report formatting", "Protect personnel, community and environment from infectious agents"], correctIndex: 3 },
  { prompt: "PEPFAR primarily funds programs addressing which disease?", options: ["Malaria", "Tuberculosis", "HIV/AIDS", "Cholera"], correctIndex: 2 },
  { prompt: "What does laboratory Turnaround Time (TAT) measure?", options: ["Time from sample collection to result reporting", "Time to calibrate equipment", "Time to train new staff", "Time to order reagents"], correctIndex: 0 }
];

/* ============================================================
   App logic
   ============================================================ */
const QUIZ_NAME = "QualiTracker Quiz";
const QUESTION_SECONDS = 15;
const QUIZ_LENGTH = 10;
const PIN_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion
const PIN_LENGTH = 6;

const urlParams = new URLSearchParams(window.location.search);
const viewParam = urlParams.get('view');
const initialView = ['register','quiz','leaderboard','admin'].includes(viewParam) ? viewParam : 'register';

let state = {
  view: initialView,
  registerScreen: 'form',
  lastPin: null,
  participant: { id: null, name: "", region: "", district: "", facility: "", facilityOther: "", photo: null },

  quizScreen: 'login',
  quizParticipants: [], quizParticipantsLoading: false, quizLoginError: null,
  quizSelectedId: "", quizPinInput: "",
  currentParticipant: null,
  qIndex: 0, score: 0, correctCount: 0, timeLeft: QUESTION_SECONDS, timerId: null, locked: false,
  quizQuestions: [],

  adminAuthed: false, adminPasswordInput: "", adminError: null,
  adminQuestions: [], adminLoading: false,
  adminNewPrompt: "", adminNewOpts: ["", "", "", ""], adminNewCorrect: 0,
  adminBulkText: "", adminBulkMsg: null,
  adminExporting: false,

  lbLoading: false, lbData: null, lbError: null, lbInterval: null
};

function uid(){ try { return crypto.randomUUID(); } catch(e){ return 'p-' + Date.now() + '-' + Math.random().toString(16).slice(2); } }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generatePin(){ let s = ''; for(let i=0;i<PIN_LENGTH;i++) s += PIN_CHARS[Math.floor(Math.random()*PIN_CHARS.length)]; return s; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view === 'admin') app.appendChild(renderAdmin());
  else if(state.view === 'leaderboard') app.appendChild(renderLeaderboardView());
  else if(state.view === 'quiz'){
    if(state.quizScreen === 'login') app.appendChild(renderQuizLogin());
    else if(state.quizScreen === 'playing') app.appendChild(renderQuizPlaying());
    else if(state.quizScreen === 'results') app.appendChild(renderQuizResults());
  } else {
    if(state.registerScreen === 'form') app.appendChild(renderRegisterForm());
    else app.appendChild(renderRegisterDone());
  }
}

function headerBlock(subtitle){
  return `
    <div class="header">
      <div class="eyebrow">Conference Quiz</div>
      <h1>${QUIZ_NAME}</h1>
      <p>${subtitle}</p>
      <svg class="pulse-line" viewBox="0 0 220 22" preserveAspectRatio="none">
        <path d="M0,11 L60,11 L72,2 L84,20 L96,11 L220,11" />
      </svg>
    </div>`;
}

function baseUrl(view){
  return window.location.origin + window.location.pathname + '?view=' + view;
}

/* ============================================================
   REGISTER
   ============================================================ */
function renderRegisterForm(){
  const wrap = el(`<div>${headerBlock("Register once to get your PIN, then take the quiz on the login page.")}</div>`);

  const qrWrap = el(`
    <div class="card qr-wrap">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(baseUrl('register'))}" width="140" height="140" alt="QR code to registration" />
      <span>Scan to register on your phone</span>
    </div>`);
  wrap.appendChild(qrWrap);

  const card = el(`<div class="card"></div>`);

  const photoLabel = el(`<label>Your photo</label>`);
  const photoPicker = el(`
    <div class="photo-picker">
      <div class="photo-preview" id="photoPreview">Tap to add photo</div>
      <input type="file" id="photoInput" accept="image/*" capture="user" style="display:none;" />
      <button type="button" class="btn btn-ghost" id="photoBtn" style="margin-top:0;width:auto;padding:10px 18px;">Take / choose photo</button>
    </div>`);
  card.appendChild(photoLabel);
  card.appendChild(photoPicker);

  const preview = photoPicker.querySelector('#photoPreview');
  if(state.participant.photo){
    preview.outerHTML = `<img id="photoPreview" class="photo-preview filled" src="${state.participant.photo}" alt="Your photo" />`;
  }
  photoPicker.querySelector('#photoBtn').addEventListener('click', () => photoPicker.querySelector('#photoInput').click());
  photoPicker.querySelector('#photoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try {
      const dataUrl = await fileToResizedDataUrl(file, 220, 0.75);
      state.participant.photo = dataUrl;
      render();
    } catch(err){ console.error('Photo processing failed', err); }
  });

  const nameLabel = el(`<label for="pname">Your name</label>`);
  const nameInput = el(`<input type="text" id="pname" placeholder="e.g. Asha Mwakalinga" autocomplete="name" />`);
  nameInput.value = state.participant.name;
  nameInput.addEventListener('input', e => { state.participant.name = e.target.value; updateRegisterButton(); });

  const regionLabel = el(`<label for="pregion">Region</label>`);
  const regionSelect = el(`<select id="pregion"></select>`);
  regionSelect.appendChild(el(`<option value="">Select region…</option>`));
  Object.keys(REGION_DATA).forEach(r => regionSelect.appendChild(el(`<option value="${r}">${r}</option>`)));
  regionSelect.appendChild(el(`<option value="__other__">Other / not listed</option>`));
  regionSelect.value = state.participant.region;

  const districtLabel = el(`<label for="pdistrict">District</label>`);
  const districtSelect = el(`<select id="pdistrict" disabled></select>`);
  districtSelect.appendChild(el(`<option value="">Select district…</option>`));

  const facilityLabel = el(`<label for="pfacility">Health facility / institution</label>`);
  const facilitySelect = el(`<select id="pfacility" disabled></select>`);
  facilitySelect.appendChild(el(`<option value="">Select facility…</option>`));

  const facilityOtherInput = el(`<input type="text" id="pfacilityOther" placeholder="Type your facility name" style="display:none;margin-top:8px;" />`);
  facilityOtherInput.value = state.participant.facilityOther;
  facilityOtherInput.addEventListener('input', e => { state.participant.facilityOther = e.target.value; updateRegisterButton(); });

  function populateDistricts(region){
    districtSelect.innerHTML = '<option value="">Select district…</option>';
    if(region && region !== '__other__' && REGION_DATA[region]){
      Object.keys(REGION_DATA[region]).forEach(d => districtSelect.appendChild(el(`<option value="${d}">${d}</option>`)));
      districtSelect.disabled = false;
    } else districtSelect.disabled = true;
  }
  function populateFacilities(region, district){
    facilitySelect.innerHTML = '<option value="">Select facility…</option>';
    if(region && region !== '__other__' && district && REGION_DATA[region] && REGION_DATA[region][district]){
      REGION_DATA[region][district].forEach(f => facilitySelect.appendChild(el(`<option value="${f}">${f}</option>`)));
      facilitySelect.disabled = false;
      facilityOtherInput.style.display = 'none';
    } else facilitySelect.disabled = true;
  }

  regionSelect.addEventListener('change', e => {
    state.participant.region = e.target.value; state.participant.district = ''; state.participant.facility = '';
    populateDistricts(e.target.value);
    facilitySelect.innerHTML = '<option value="">Select facility…</option>'; facilitySelect.disabled = true;
    facilityOtherInput.style.display = (e.target.value === '__other__') ? 'block' : 'none';
    updateRegisterButton();
  });
  districtSelect.addEventListener('change', e => {
    state.participant.district = e.target.value; state.participant.facility = '';
    populateFacilities(state.participant.region, e.target.value);
    updateRegisterButton();
  });
  facilitySelect.addEventListener('change', e => { state.participant.facility = e.target.value; updateRegisterButton(); });

  if(state.participant.region) populateDistricts(state.participant.region);
  if(state.participant.region && state.participant.district) populateFacilities(state.participant.region, state.participant.district);

  card.appendChild(nameLabel); card.appendChild(nameInput);
  card.appendChild(regionLabel); card.appendChild(regionSelect);
  card.appendChild(districtLabel); card.appendChild(districtSelect);
  card.appendChild(facilityLabel); card.appendChild(facilitySelect);
  card.appendChild(facilityOtherInput);

  const regBtn = el(`<button class="btn btn-primary" id="regBtn" disabled>Register &amp; get my PIN</button>`);
  regBtn.addEventListener('click', registerParticipant);
  card.appendChild(regBtn);

  wrap.appendChild(card);
  setTimeout(updateRegisterButton, 0);
  return wrap;
}

function fileToResizedDataUrl(file, size, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateRegisterButton(){
  const btn = document.getElementById('regBtn');
  if(!btn) return;
  const p = state.participant;
  const facilityOk = p.region === '__other__' ? (p.facilityOther && p.facilityOther.trim().length > 0) : !!p.facility;
  const ok = p.name.trim().length > 0 && !!p.region && (p.region === '__other__' || !!p.district) && facilityOk && !!p.photo;
  btn.disabled = !ok;
  btn.textContent = p.photo ? 'Register & get my PIN' : 'Add a photo to continue';
}

async function registerParticipant(){
  const btn = document.getElementById('regBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Registering…'; }
  const p = state.participant;
  const facilityName = p.region === '__other__' ? (p.facilityOther || 'Other') : p.facility;
  const id = uid();
  const pin = generatePin();
  const record = {
    id, name: p.name.trim(), photo: p.photo,
    region: p.region === '__other__' ? 'Other' : p.region,
    district: p.region === '__other__' ? '—' : p.district,
    facility: facilityName, pin,
    completed: false, score: 0, correctCount: 0, totalQuestions: 0,
    registeredAt: new Date().toISOString(), completedAt: null
  };
  try {
    await window.storage.set('participant:' + id, JSON.stringify(record), true);
    state.lastPin = pin;
    state.registerScreen = 'done';
    render();
  } catch(err){
    console.error('Registration failed', err);
    alert('Registration failed — please check your connection and try again.');
    if(btn){ btn.disabled = false; btn.textContent = 'Register & get my PIN'; }
  }
}

function renderRegisterDone(){
  const wrap = el(`<div>${headerBlock("You're registered.")}</div>`);
  const card = el(`
    <div class="card">
      <label style="margin-top:0;">Your name</label>
      <div style="font-weight:600;font-size:16px;">${escapeHtml(state.participant.name)}</div>
      <label>Your PIN</label>
      <div class="pin-display">${state.lastPin}</div>
      <div class="pin-note">Save this PIN — you'll need it with your name to log in and take the quiz. It only works once.</div>
    </div>`);
  wrap.appendChild(card);

  const nav = el(`<div class="footer-nav"></div>`);
  const quizBtn = el(`<button class="btn btn-primary">Go to quiz login</button>`);
  quizBtn.addEventListener('click', () => { window.location.href = baseUrl('quiz'); });
  const anotherBtn = el(`<button class="btn btn-ghost">Register someone else</button>`);
  anotherBtn.addEventListener('click', () => {
    state.participant = { id: null, name: "", region: "", district: "", facility: "", facilityOther: "", photo: null };
    state.registerScreen = 'form'; state.lastPin = null; render();
  });
  nav.appendChild(quizBtn); nav.appendChild(anotherBtn);
  wrap.appendChild(nav);
  return wrap;
}

/* ============================================================
   QUIZ LOGIN (?view=quiz)
   ============================================================ */
function renderQuizLogin(){
  const wrap = el(`<div>${headerBlock("Log in with your name and PIN to begin.")}</div>`);
  const card = el(`<div class="card"></div>`);

  if(state.quizParticipantsLoading){
    card.appendChild(el(`<div class="loading-note">Loading registered participants…</div>`));
    wrap.appendChild(card);
    return wrap;
  }

  card.appendChild(el(`<label for="quizName">Your name</label>`));
  const sel = el(`<select id="quizName"></select>`);
  sel.appendChild(el(`<option value="">Select your name…</option>`));
  const sorted = [...state.quizParticipants].sort((a,b) => a.name.localeCompare(b.name));
  sorted.forEach(p => sel.appendChild(el(`<option value="${p.id}">${escapeHtml(p.name)} — ${escapeHtml(p.facility)}</option>`)));
  sel.value = state.quizSelectedId;
  sel.addEventListener('change', e => { state.quizSelectedId = e.target.value; });
  card.appendChild(sel);

  card.appendChild(el(`<label for="quizPin">PIN</label>`));
  const pinInput = el(`<input type="text" id="quizPin" class="pin-input" maxlength="8" placeholder="••••••" autocomplete="off" />`);
  pinInput.value = state.quizPinInput;
  pinInput.addEventListener('input', e => { state.quizPinInput = e.target.value.toUpperCase(); e.target.value = state.quizPinInput; });
  card.appendChild(pinInput);

  if(state.quizLoginError) card.appendChild(el(`<div class="feedback bad">${escapeHtml(state.quizLoginError)}</div>`));

  const goBtn = el(`<button class="btn btn-primary">Start quiz</button>`);
  goBtn.addEventListener('click', attemptQuizLogin);
  card.appendChild(goBtn);
  wrap.appendChild(card);

  const linkRow = el(`<div class="link-row"><a id="toRegister">Not registered yet? Register here →</a></div>`);
  linkRow.querySelector('a').addEventListener('click', () => { window.location.href = baseUrl('register'); });
  wrap.appendChild(linkRow);

  return wrap;
}

async function loadQuizParticipants(){
  state.quizParticipantsLoading = true; render();
  try {
    const listResult = await window.storage.list('participant:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const results = [];
    for(const k of keys){
      try { const r = await window.storage.get(k, true); if(r && r.value) results.push(JSON.parse(r.value)); } catch(e){}
    }
    state.quizParticipants = results;
  } catch(err){ console.error('Failed to load participants', err); state.quizParticipants = []; }
  finally { state.quizParticipantsLoading = false; render(); }
}

function attemptQuizLogin(){
  state.quizLoginError = null;
  if(!state.quizSelectedId){ state.quizLoginError = 'Please select your name.'; render(); return; }
  const record = state.quizParticipants.find(p => p.id === state.quizSelectedId);
  if(!record || record.pin !== state.quizPinInput.trim().toUpperCase()){
    state.quizLoginError = 'Name and PIN don\u2019t match. Please check and try again.';
    render(); return;
  }
  if(record.completed){
    state.quizLoginError = 'You\u2019ve already completed this quiz — thanks for participating!';
    render(); return;
  }
  startQuiz(record);
}

async function startQuiz(record){
  state.currentParticipant = record;
  let pool = [];
  try {
    const r = await window.storage.get('question-bank', true);
    pool = r && r.value ? JSON.parse(r.value) : [];
  } catch(e) { pool = []; }
  if(!pool || pool.length === 0) pool = SEED_QUESTIONS;

  const picked = shuffle(pool).slice(0, Math.min(QUIZ_LENGTH, pool.length));
  state.quizQuestions = picked.map(q => {
    const optOrder = shuffle(q.options.map((opt, i) => ({ opt, i })));
    return { prompt: q.prompt, options: optOrder.map(o => o.opt), correctIndex: optOrder.findIndex(o => o.i === q.correctIndex) };
  });

  state.qIndex = 0; state.score = 0; state.correctCount = 0;
  state.quizScreen = 'playing';
  render();
  beginQuestionTimer();
}

/* ============================================================
   QUIZ PLAYING
   ============================================================ */
function renderQuizPlaying(){
  const q = state.quizQuestions[state.qIndex];
  const wrap = el(`<div></div>`);
  const top = el(`
    <div class="quiz-top">
      <div class="qcount">Question ${state.qIndex + 1} of ${state.quizQuestions.length}</div>
      <div class="ring-wrap">
        <svg width="54" height="54" viewBox="0 0 54 54">
          <circle class="ring-bg" cx="27" cy="27" r="22"></circle>
          <circle class="ring-fg" id="ringFg" cx="27" cy="27" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"></circle>
        </svg>
        <div class="ring-num" id="ringNum">${state.timeLeft}</div>
      </div>
    </div>`);
  wrap.appendChild(top);

  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<div class="qtext">${escapeHtml(q.prompt)}</div>`));
  q.options.forEach((opt, i) => {
    const b = el(`<button class="opt opt-${i}" data-i="${i}">${escapeHtml(opt)}</button>`);
    b.addEventListener('click', () => selectAnswer(i));
    card.appendChild(b);
  });
  card.appendChild(el(`<div class="feedback" id="feedbackMsg"></div>`));
  wrap.appendChild(card);
  return wrap;
}

function beginQuestionTimer(){
  clearInterval(state.timerId);
  state.timeLeft = QUESTION_SECONDS;
  state.locked = false;
  updateRing();
  state.timerId = setInterval(() => {
    state.timeLeft -= 1;
    if(state.timeLeft <= 0){
      state.timeLeft = 0; updateRing(); clearInterval(state.timerId);
      if(!state.locked) selectAnswer(-1);
      return;
    }
    updateRing();
  }, 1000);
}

function updateRing(){
  const num = document.getElementById('ringNum');
  const ring = document.getElementById('ringFg');
  if(!num || !ring) return;
  num.textContent = state.timeLeft;
  const frac = state.timeLeft / QUESTION_SECONDS;
  ring.style.strokeDashoffset = String(138.2 * (1 - frac));
  ring.style.stroke = frac <= 0.25 ? '#C4432B' : '#E8A93A';
}

function selectAnswer(choiceIndex){
  if(state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);
  const q = state.quizQuestions[state.qIndex];
  const buttons = document.querySelectorAll('.opt');
  const fb = document.getElementById('feedbackMsg');
  const isCorrect = choiceIndex === q.correctIndex;

  buttons.forEach((b, i) => {
    b.disabled = true;
    if(i === q.correctIndex) b.classList.add('correct');
    else if(i === choiceIndex) b.classList.add('incorrect');
    else b.classList.add('dim');
  });

  if(isCorrect){
    const points = 500 + Math.round(500 * (state.timeLeft / QUESTION_SECONDS));
    state.score += points; state.correctCount += 1;
    if(fb){ fb.textContent = `Correct! +${points} points`; fb.className = 'feedback good'; }
  } else {
    if(fb){ fb.textContent = choiceIndex === -1 ? "Time's up — 0 points" : 'Not quite — 0 points'; fb.className = 'feedback bad'; }
  }

  setTimeout(() => {
    if(state.qIndex < state.quizQuestions.length - 1){ state.qIndex += 1; render(); beginQuestionTimer(); }
    else finishQuiz();
  }, 1200);
}

async function finishQuiz(){
  state.quizScreen = 'results';
  render();
  try {
    const p = state.currentParticipant;
    const updated = Object.assign({}, p, {
      completed: true, score: state.score, correctCount: state.correctCount,
      totalQuestions: state.quizQuestions.length, completedAt: new Date().toISOString()
    });
    await window.storage.set('participant:' + p.id, JSON.stringify(updated), true);
    state.currentParticipant = updated;
  } catch(err){ console.error('Failed to save result', err); }
}

function renderQuizResults(){
  const wrap = el(`<div>${headerBlock("Nice work — here's how you did.")}</div>`);
  const card = el(`
    <div class="card">
      <div class="score-hero">
        <div class="cap">Your score</div>
        <div class="big mono">${state.score}</div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="n">${state.correctCount}/${state.quizQuestions.length}</div><div class="l">Correct</div></div>
        <div class="stat"><div class="n">${escapeHtml(state.currentParticipant ? state.currentParticipant.region : '—')}</div><div class="l">Region</div></div>
      </div>
    </div>`);
  wrap.appendChild(card);

  const nav = el(`<div class="footer-nav"></div>`);
  const lbBtn = el(`<button class="btn btn-primary">View leaderboard</button>`);
  lbBtn.addEventListener('click', () => { window.location.href = baseUrl('leaderboard'); });
  nav.appendChild(lbBtn);
  wrap.appendChild(nav);
  return wrap;
}

/* ============================================================
   LEADERBOARD (?view=leaderboard)
   ============================================================ */
function renderLeaderboardView(){
  const wrap = el(`<div>${headerBlock("Live results across the conference.")}</div>`);
  const backLink = el(`<div class="link-row"><a id="backLink">Open registration →</a></div>`);
  backLink.querySelector('a').addEventListener('click', () => { window.location.href = baseUrl('register'); });
  wrap.appendChild(backLink);
  const refreshBtn = el(`<button class="btn btn-ghost" id="refreshBtn" style="margin-top:14px;">Refresh</button>`);
  refreshBtn.addEventListener('click', loadLeaderboard);
  wrap.appendChild(refreshBtn);
  const content = el(`<div id="lbContent"></div>`);
  wrap.appendChild(content);
  renderLeaderboardContent(content);
  if(!state.lbInterval) state.lbInterval = setInterval(loadLeaderboard, 20000);
  return wrap;
}

function renderLeaderboardContent(container){
  container.innerHTML = '';
  if(state.lbLoading){ container.appendChild(el(`<div class="loading-note">Loading results…</div>`)); return; }
  if(state.lbError){ container.appendChild(el(`<div class="empty-note">Couldn't load results. Try refresh.</div>`)); return; }
  const all = state.lbData || [];
  const data = all.filter(r => r.completed);
  if(data.length === 0){ container.appendChild(el(`<div class="empty-note">No one has finished the quiz yet.</div>`)); return; }

  const byScore = [...data].sort((a,b) => b.score - a.score).slice(0, 10);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Top participants</h3></div>`));
  byScore.forEach((r, i) => {
    const avatarHtml = (i < 3)
      ? (r.photo ? `<img class="avatar" src="${r.photo}" alt="${escapeHtml(r.name)}" />` : `<div class="avatar-placeholder">${escapeHtml((r.name||'?').charAt(0).toUpperCase())}</div>`)
      : '';
    container.appendChild(el(`
      <div class="lb-row">
        <div class="lb-rank">${i+1}</div>
        ${avatarHtml}
        <div class="lb-main"><div class="lb-name">${escapeHtml(r.name)}</div><div class="lb-sub">${escapeHtml(r.facility)} · ${escapeHtml(r.region)}</div></div>
        <div class="lb-score mono">${r.score}</div>
      </div>`));
  });

  const byFacility = {};
  data.forEach(r => { const k = r.facility || 'Unknown'; if(!byFacility[k]) byFacility[k] = {total:0,count:0}; byFacility[k].total += r.score; byFacility[k].count += 1; });
  const facilityRanked = Object.entries(byFacility).map(([name,v]) => ({name, avg: Math.round(v.total/v.count), count: v.count})).sort((a,b)=>b.avg-a.avg).slice(0,3);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Top institutions</h3></div>`));
  facilityRanked.forEach((f,i) => {
    container.appendChild(el(`
      <div class="lb-row"><div class="lb-rank">${i+1}</div>
        <div class="lb-main"><div class="lb-name">${escapeHtml(f.name)}</div><div class="lb-sub">${f.count} participant${f.count===1?'':'s'}</div></div>
        <div class="lb-score mono">${f.avg}</div></div>`));
  });

  const byRegion = {};
  data.forEach(r => { const k = r.region || 'Unknown'; if(!byRegion[k]) byRegion[k] = {total:0,count:0}; byRegion[k].total += r.score; byRegion[k].count += 1; });
  const regionRanked = Object.entries(byRegion).map(([name,v]) => ({name, avg: Math.round(v.total/v.count), count: v.count})).sort((a,b)=>b.avg-a.avg);
  container.appendChild(el(`<div class="lb-section-title"><span class="dot"></span><h3>Average score by region</h3></div>`));
  regionRanked.forEach(r => {
    container.appendChild(el(`
      <div class="lb-row">
        <div class="lb-main"><div class="lb-name">${escapeHtml(r.name)}</div><div class="lb-sub">${r.count} participant${r.count===1?'':'s'}</div></div>
        <div class="lb-score mono">${r.avg}</div></div>`));
  });

  container.appendChild(el(`<div class="empty-note">${data.length} total ${data.length===1?'response':'responses'} recorded</div>`));
}

async function loadLeaderboard(){
  state.lbLoading = true; state.lbError = null;
  const content = document.getElementById('lbContent');
  if(content) renderLeaderboardContent(content);
  try {
    const listResult = await window.storage.list('participant:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const results = [];
    for(const k of keys){
      try { const r = await window.storage.get(k, true); if(r && r.value) results.push(JSON.parse(r.value)); } catch(e){}
    }
    state.lbData = results;
  } catch(err){ console.error('Failed to load leaderboard', err); state.lbError = err; }
  finally {
    state.lbLoading = false;
    const c = document.getElementById('lbContent');
    if(c) renderLeaderboardContent(c);
  }
}

/* ============================================================
   ADMIN (?view=admin)
   ============================================================ */
function renderAdmin(){
  const wrap = el(`<div>${headerBlock("Question bank & participant management")}</div>`);

  if(!state.adminAuthed){
    const card = el(`<div class="card"></div>`);
    card.appendChild(el(`<label for="adminPass">Admin password</label>`));
    const input = el(`<input type="password" id="adminPass" placeholder="Enter password" />`);
    input.addEventListener('input', e => state.adminPasswordInput = e.target.value);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') tryAdminLogin(); });
    card.appendChild(input);
    if(state.adminError) card.appendChild(el(`<div class="feedback bad">${escapeHtml(state.adminError)}</div>`));
    const btn = el(`<button class="btn btn-primary">Unlock</button>`);
    btn.addEventListener('click', tryAdminLogin);
    card.appendChild(btn);
    wrap.appendChild(card);
    return wrap;
  }

  const summary = el(`<div class="card"><span class="pill">${state.adminQuestions.length} question${state.adminQuestions.length===1?'':'s'} in pool</span></div>`);
  const exportBtn = el(`<button class="btn btn-ghost" style="margin-top:0;width:auto;padding:8px 14px;display:inline-block;">${state.adminExporting ? 'Preparing…' : 'Export participants (CSV)'}</button>`);
  exportBtn.addEventListener('click', exportParticipantsCsv);
  summary.appendChild(el(`<div style="margin-top:12px;"></div>`));
  summary.lastElementChild.appendChild(exportBtn);
  wrap.appendChild(summary);

  const addCard = el(`<div class="card"><h3 style="font-size:16px;margin-bottom:10px;">Add a question</h3></div>`);
  addCard.appendChild(el(`<label>Question</label>`));
  const promptInput = el(`<textarea id="newPrompt" placeholder="Type the question…"></textarea>`);
  promptInput.value = state.adminNewPrompt;
  promptInput.addEventListener('input', e => state.adminNewPrompt = e.target.value);
  addCard.appendChild(promptInput);

  for(let i=0;i<4;i++){
    addCard.appendChild(el(`<label>Option ${i+1}${i===state.adminNewCorrect ? ' (correct)' : ''}</label>`));
    const row = el(`<div style="display:flex;gap:8px;align-items:center;"></div>`);
    const optInput = el(`<input type="text" placeholder="Answer option ${i+1}" />`);
    optInput.value = state.adminNewOpts[i];
    optInput.addEventListener('input', e => state.adminNewOpts[i] = e.target.value);
    const radio = el(`<input type="radio" name="correctOpt" style="width:20px;height:20px;flex-shrink:0;" ${i===state.adminNewCorrect?'checked':''} />`);
    radio.addEventListener('change', () => { state.adminNewCorrect = i; });
    row.appendChild(optInput); row.appendChild(radio);
    addCard.appendChild(row);
  }
  addCard.appendChild(el(`<div class="hint">Select the radio button next to the correct answer.</div>`));
  const addBtn = el(`<button class="btn btn-primary">Add question</button>`);
  addBtn.addEventListener('click', addSingleQuestion);
  addCard.appendChild(addBtn);
  wrap.appendChild(addCard);

  const bulkCard = el(`<div class="card"><h3 style="font-size:16px;margin-bottom:6px;">Bulk import</h3></div>`);
  bulkCard.appendChild(el(`<div class="hint">One question per line: <span class="mono">question | option A | option B | option C | option D | correct (0-3)</span></div>`));
  const bulkArea = el(`<textarea id="bulkArea" placeholder="What does QMS stand for? | Quality Metrics System | Quality Management System | Quick Measurement Sheet | Quality Manual Series | 1" style="margin-top:10px;min-height:120px;"></textarea>`);
  bulkArea.value = state.adminBulkText;
  bulkArea.addEventListener('input', e => state.adminBulkText = e.target.value);
  bulkCard.appendChild(bulkArea);
  if(state.adminBulkMsg) bulkCard.appendChild(el(`<div class="feedback ${state.adminBulkMsg.ok ? 'good' : 'bad'}">${escapeHtml(state.adminBulkMsg.text)}</div>`));
  const bulkBtn = el(`<button class="btn btn-primary">Import lines</button>`);
  bulkBtn.addEventListener('click', bulkImport);
  bulkCard.appendChild(bulkBtn);
  wrap.appendChild(bulkCard);

  wrap.appendChild(el(`<hr class="divider" />`));
  wrap.appendChild(el(`<h3 style="font-size:16px;margin-bottom:10px;">Current pool</h3>`));
  if(state.adminLoading){
    wrap.appendChild(el(`<div class="loading-note">Loading…</div>`));
  } else if(state.adminQuestions.length === 0){
    wrap.appendChild(el(`<div class="empty-note">No questions yet — add some above.</div>`));
  } else {
    state.adminQuestions.forEach((q, idx) => {
      const qCard = el(`<div class="admin-q"></div>`);
      qCard.appendChild(el(`<div class="aq-prompt">${idx+1}. ${escapeHtml(q.prompt)}</div>`));
      const optsList = q.options.map((o,i) => `<span class="${i===q.correctIndex?'aq-correct':''}">${i===q.correctIndex?'✓ ':''}${escapeHtml(o)}</span>`).join(' · ');
      qCard.appendChild(el(`<div class="aq-opts">${optsList}</div>`));
      const foot = el(`<div class="admin-q-foot"></div>`);
      const delBtn = el(`<button class="btn btn-danger">Delete</button>`);
      delBtn.addEventListener('click', () => deleteQuestion(idx));
      foot.appendChild(delBtn);
      qCard.appendChild(foot);
      wrap.appendChild(qCard);
    });
  }
  return wrap;
}

function tryAdminLogin(){
  if(state.adminPasswordInput === ADMIN_PASSWORD){
    state.adminAuthed = true; state.adminError = null;
    render();
    loadAdminQuestions();
  } else {
    state.adminError = 'Incorrect password.';
    render();
  }
}

async function loadAdminQuestions(){
  state.adminLoading = true; render();
  try {
    const r = await window.storage.get('question-bank', true);
    let pool = r && r.value ? JSON.parse(r.value) : null;
    if(!pool){ pool = SEED_QUESTIONS.slice(); await window.storage.set('question-bank', JSON.stringify(pool), true); }
    state.adminQuestions = pool;
  } catch(e){ console.error('Failed to load question bank', e); state.adminQuestions = []; }
  finally { state.adminLoading = false; render(); }
}

async function saveQuestionBank(){
  try { await window.storage.set('question-bank', JSON.stringify(state.adminQuestions), true); }
  catch(e){ console.error('Failed to save question bank', e); }
}

function addSingleQuestion(){
  const prompt = state.adminNewPrompt.trim();
  const opts = state.adminNewOpts.map(o => o.trim());
  if(!prompt || opts.some(o => !o)){ alert('Please fill in the question and all four options.'); return; }
  state.adminQuestions.push({ prompt, options: opts, correctIndex: state.adminNewCorrect });
  state.adminNewPrompt = ""; state.adminNewOpts = ["", "", "", ""]; state.adminNewCorrect = 0;
  saveQuestionBank();
  render();
}

function bulkImport(){
  const lines = state.adminBulkText.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0, skipped = 0;
  lines.forEach(line => {
    const parts = line.split('|').map(p => p.trim());
    if(parts.length !== 6){ skipped++; return; }
    const [prompt, a, b, c, d, correctStr] = parts;
    const correctIndex = parseInt(correctStr, 10);
    if(!prompt || !a || !b || !c || !d || isNaN(correctIndex) || correctIndex < 0 || correctIndex > 3){ skipped++; return; }
    state.adminQuestions.push({ prompt, options: [a,b,c,d], correctIndex });
    added++;
  });
  state.adminBulkMsg = { ok: skipped === 0, text: `Added ${added} question${added===1?'':'s'}${skipped ? `, skipped ${skipped} malformed line${skipped===1?'':'s'}` : ''}.` };
  if(added > 0){ state.adminBulkText = ""; saveQuestionBank(); }
  render();
}

function deleteQuestion(idx){
  if(!confirm('Delete this question?')) return;
  state.adminQuestions.splice(idx, 1);
  saveQuestionBank();
  render();
}

async function exportParticipantsCsv(){
  state.adminExporting = true; render();
  try {
    const listResult = await window.storage.list('participant:', true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const rows = [];
    for(const k of keys){
      try { const r = await window.storage.get(k, true); if(r && r.value) rows.push(JSON.parse(r.value)); } catch(e){}
    }
    const header = ['Name','Region','District','Facility','PIN','Completed','Score','Correct','Total Questions','Registered At','Completed At'];
    const csvLines = [header.join(',')];
    rows.forEach(r => {
      const line = [r.name, r.region, r.district, r.facility, r.pin, r.completed ? 'Yes' : 'No', r.score, r.correctCount, r.totalQuestions, r.registeredAt || '', r.completedAt || '']
        .map(v => `"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
      csvLines.push(line);
    });
    const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'qualitracker-quiz-participants.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(err){
    console.error('Export failed', err);
    alert('Export failed — please try again.');
  } finally {
    state.adminExporting = false; render();
  }
}

render();
if(state.view === 'quiz') loadQuizParticipants();
if(state.view === 'leaderboard') loadLeaderboard();
</script>
